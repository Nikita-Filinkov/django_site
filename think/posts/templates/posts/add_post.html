{% extends 'posts/base.html' %}


{% block title %} <title>{{ title }}</title> {% endblock %}

{% block posts %}
<h1>{{ title }}</h1>
<form action="" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {% for f in form %}
    <label for="{{ f.id_for_label }}">{{ f.label }}</label><br>
    <p>{{ f }}</p>
    <p><button type="submit">Отправить</button></p>
</form>
{% endblock %}
