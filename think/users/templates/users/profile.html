{% extends 'users/base.html' %}

<title>{{ title }}</title>

<h1>{{ title }}</h1>

{% block content %}

<form method="POST">
    {% csrf_token %}
    <div class="errors">{{ form.non_field_error }}</div>
    {% for f in form %}
    <p><label for="{{ f.id_for_lable }}">{{ f.label }}</label><br>{{ f }}</p>
    <p class="errors">{{ f.errors }}</p>
    {% endfor %}

    <p><button type="submit">Сохранить</button></p>
</form>
<hr>
<p><a href="{% url 'users:password_change' %}">Сменить пароль</a></p>
{% endblock %}
